<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CloudCast · Login mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--pink:#ff8fb1;--pink-deep:#ff5d8f;--lav:#a78bfa;--sky:#7dd3fc;--ink:#5b4a63;--ink-soft:#8b7a93}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:'M PLUS Rounded 1c',sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1000px 600px at 15% 0%,#ffe3ee,transparent 55%),radial-gradient(900px 600px at 100% 100%,#ece2ff,transparent 55%),linear-gradient(160deg,#fff5f7,#f6ecff 60%,#eef4ff)}
  .blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.5;z-index:0}
  .b1{width:300px;height:300px;background:#ffc2d6;top:-40px;left:-30px}
  .b2{width:280px;height:280px;background:#cdb4ff;bottom:-60px;right:-30px}
  h1,h2,h3{font-family:'Baloo 2'}
  .stage{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:0;max-width:880px;width:100%;
    background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 30px 70px -30px rgba(255,93,143,.5)}
  @media(max-width:760px){.stage{grid-template-columns:1fr}.hero{display:none}}
  .hero{background:linear-gradient(160deg,#ffd6e6,#d9c8ff);padding:40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
  .hero .m{font-size:90px;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
  .hero h2{margin:14px 0 6px;font-size:26px;color:#fff;text-shadow:0 2px 8px rgba(255,93,143,.4)}
  .hero p{margin:0;color:#fff;opacity:.95;font-size:14px;max-width:240px}
  .sparkle{position:absolute;font-size:20px;animation:tw 3s ease-in-out infinite}
  .s1{top:30px;left:40px}.s2{bottom:50px;right:46px;animation-delay:.6s}.s3{top:60px;right:60px;animation-delay:1.2s}
  @keyframes tw{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  .panel{padding:42px 38px}
  .tabs{display:flex;gap:8px;margin-bottom:24px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;border:none;font-family:inherit}
  .tab.on{background:linear-gradient(120deg,var(--pink-deep),var(--lav));color:#fff;box-shadow:0 8px 18px -8px rgba(255,93,143,.6)}
  .tab.off{background:#f6eefc;color:var(--ink-soft)}
  .panel h1{margin:0 0 4px;font-size:24px;background:linear-gradient(90deg,var(--pink-deep),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent}
  .panel .sub{margin:0 0 22px;color:var(--ink-soft);font-size:13px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  .inwrap{position:relative}
  .field input{width:100%;border:2px solid #ffe1ea;border-radius:14px;padding:13px 14px;font-family:inherit;font-size:14px}
  .field input:focus{outline:none;border-color:var(--pink)}
  .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;opacity:.6}
  .btn{width:100%;border:none;border-radius:16px;padding:15px;font-family:'Baloo 2';font-weight:700;font-size:17px;color:#fff;cursor:pointer;
    background:linear-gradient(120deg,var(--pink-deep),var(--lav));box-shadow:0 12px 24px -10px rgba(255,93,143,.6),0 3px 0 #e0428f}
  .btn:active{transform:translateY(2px)}
  .alt{margin-top:18px;text-align:center;font-size:13px;color:var(--ink-soft)}
  .alt a{color:var(--pink-deep);font-weight:700;text-decoration:none}
  .note{position:fixed;bottom:16px;z-index:1;color:var(--ink-soft);font-size:12px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="stage">
  <div class="hero">
    <span class="sparkle s1">✨</span><span class="sparkle s2">🌸</span><span class="sparkle s3">⭐</span>
    <div class="m">☁️</div>
    <h2>Welcome back!</h2>
    <p>Your clips are safe, sparkly, and waiting for you ♡</p>
  </div>
  <div class="panel">
    <div class="tabs">
      <button class="tab on">Sign in</button>
      <button class="tab off">Sign up</button>
    </div>
    <h1>Hello again 👋</h1>
    <p class="sub">Peeking to see if it's really you... 👀</p>
    <div class="field">
      <label>Email</label>
      <div class="inwrap"><input value="yuki@cloudcast.app" /></div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="inwrap"><input type="password" value="superSecret" /><span class="eye">👁</span></div>
    </div>
    <button class="btn">Let me in ✨</button>
    <p class="alt">New here? <a href="#">Make an account →</a></p>
  </div>
</div>
<p class="note">Mockup · login screen · "Sakura Idol" theme</p>
</body>
</html>
