AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudCast - Secure Video Hosting PoC

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "CloudCast-Users-${Env}"
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "CloudCast-WebClient-${Env}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  RawUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "cloudcast-raw-${Env}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: ["PUT", "POST", "GET", "HEAD"]
            AllowedOrigins: ["http://localhost:5173"]
            ExposedHeaders: ["ETag"]
            MaxAge: 3000
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ProcessedVideosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "cloudcast-processed-${Env}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: ["HEAD", "GET", "POST"]
            AllowedOrigins: ["*"]
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "CloudCast-Users-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  VideosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "CloudCast-Videos-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: VideoIdIndex
          Projection:
            ProjectionType: ALL
          KeySchema:
            - AttributeName: id
              KeyType: HASH

  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: mediaconvert.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediaConvertS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt RawUploadsBucket.Arn
                  - !Sub "${RawUploadsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ProcessedVideosBucket.Arn
                  - !Sub "${ProcessedVideosBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  ProcessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "CloudCast-Processor-${Env}"
      DefinitionUri: workflow.asl.json
      DefinitionSubstitutions:
        RawBucketName: !Ref RawUploadsBucket
        ProcessedBucketName: !Ref ProcessedVideosBucket
        VideosTableName: !Ref VideosTable
        MediaConvertRoleArn: !GetAtt MediaConvertRole.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - mediaconvert:CreateJob
                - mediaconvert:GetJob
                - mediaconvert:DescribeEndpoints
              Resource: "*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource:
                - !GetAtt MediaConvertRole.Arn
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt VideosTable.Arn
            - Effect: Allow
              Action:
                - events:PutRule
                - events:PutTargets
                - events:DescribeRule
                - events:DeleteRule
                - events:RemoveTargets
              Resource: "*"
        - EventBridgePutEventsPolicy:
            EventBusName: default
      Events:
        S3UploadEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - !Ref RawUploadsBucket


  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: !Sub "OAC for CloudCast processed videos ${Env}"
        Name: !Sub "cloudcast-oac-${Env}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        CallerReference: !Sub "${AWS::StackName}-${Env}-cloudcast-pubkey"
        Name: !Sub "cloudcast-pubkey-${Env}"
        EncodedKey: "{{resolve:ssm:/cloudcast/dev/cloudfront-public-key}}"

  CloudFrontKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: !Sub "cloudcast-keygroup-${Env}"
        Items:
          - !GetAtt CloudFrontPublicKey.Id

  ProcessedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProcessedVideosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "${ProcessedVideosBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        Origins:
          - Id: ProcessedVideosOrigin
            DomainName: !GetAtt ProcessedVideosBucket.DomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOAC
        DefaultCacheBehavior:
          TargetOriginId: ProcessedVideosOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
          TrustedKeyGroups:
            - !Ref CloudFrontKeyGroup
        PriceClass: PriceClass_100

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  RawBucketName:
    Value: !Ref RawUploadsBucket
  ProcessedBucketName:
    Value: !Ref ProcessedVideosBucket
  VideosTableName:
    Value: !Ref VideosTable
  UsersTableName:
    Value: !Ref UsersTable
  VideoIdIndex:
    Value: VideoIdIndex
  ProcessingStateMachineArn:
    Value: !Ref ProcessingStateMachine
  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontKeyId:
    Value: !GetAtt CloudFrontPublicKey.Id
